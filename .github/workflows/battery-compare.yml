# Compares the golden cases between production today and a candidate environment, for the owner to judge on
# the battery before any golden is refreshed (README, "Golden outputs"). Each job runs on one GitHub x86_64
# runner, records its CPU model, and runs every case twice on it:
#   base: Python 3.13 with main's uv.lock, no environment variables (what production runs today)
#   cand: this branch's Python and uv.lock, with the two x86_64 kernel pins from tools/golden.py
# plus cand with OPENBLAS_NUM_THREADS=1 and =4, to show the thread count does not matter. Runners land on
# different CPU models (AMD EPYC 7763, EPYC 9V74, Intel Xeon), so several jobs run to catch them. The report
# job groups the outputs by CPU, renders and diffs them, and uploads the "battery-compare" artifact.
name: Battery compare

on:
  workflow_dispatch:
    inputs:
      runners:
        description: Number of runner jobs (more catch more CPU models)
        default: "10"
  push:
    # workflow_dispatch only works once the file is on main; until then a push of these files runs it.
    branches: [python-3.15]
    paths:
      - .github/workflows/battery-compare.yml
      - tools/battery_compare.py

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.m.outputs.jobs }}
    steps:
      - id: m
        env:
          N: ${{ inputs.runners || '10' }}
        run: echo "jobs=$(seq 1 "$N" | jq -cs .)" >> "$GITHUB_OUTPUT"

  run:
    needs: matrix
    name: Run ${{ matrix.job }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.matrix.outputs.jobs) }}
    env:
      UV_NO_PROGRESS: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # renovate: datasource=pypi depName=uv
          version: 0.13.8

      - name: Install both environments
        run: |
          git worktree add "$RUNNER_TEMP/base" origin/main
          (cd "$RUNNER_TEMP/base" && UV_PYTHON=3.13 uv sync --locked --no-dev)
          UV_PYTHON=3.15 uv sync --locked --no-dev

      - name: Run the cases
        env:
          OUT: ${{ runner.temp }}/run-${{ matrix.job }}
        run: |
          mkdir -p "$OUT"
          lscpu | sed -n 's/^Model name: *//p' | head -1 | tee "$OUT/cpu.txt"
          lscpu > "$OUT/lscpu.txt"
          "$RUNNER_TEMP/base/.venv/bin/python" tools/battery_compare.py run --label base --out "$OUT"
          .venv/bin/python tools/battery_compare.py run --label cand --out "$OUT" --pinned
          .venv/bin/python tools/battery_compare.py run --label cand-threads-1 --out "$OUT" --pinned --threads 1
          .venv/bin/python tools/battery_compare.py run --label cand-threads-4 --out "$OUT" --pinned --threads 4
          rm -rf "$OUT/cand-threads-1" "$OUT/cand-threads-4"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: run-${{ matrix.job }}
          path: ${{ runner.temp }}/run-${{ matrix.job }}
          retention-days: 7

  report:
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_NO_PROGRESS: "1"
      UV_PYTHON: "3.15"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # renovate: datasource=pypi depName=uv
          version: 0.13.8

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends librsvg2-bin
          uv sync --locked --no-dev

      - name: Download runs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: run-*
          path: ${{ runner.temp }}/runs

      - name: Report
        run: |
          .venv/bin/python tools/battery_compare.py report --runs "$RUNNER_TEMP/runs" --out "$RUNNER_TEMP/battery-compare"
          du -sh "$RUNNER_TEMP/battery-compare"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: battery-compare
          path: ${{ runner.temp }}/battery-compare
          retention-days: 30
