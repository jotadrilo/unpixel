name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    # Tests from uv.lock on Python 3.15, the only version pyproject.toml allows and the one production runs.
    # This includes the golden-output check (tests/test_golden.py): a change to any battery SVG fails it.
    uses: jotadrilo/ci/.github/workflows/python-ci.yml@v1
    with:
      python-versions: '["3.15"]'
      # renovate: datasource=pypi depName=uv
      uv-version: 0.13.8
      apt-packages: librsvg2-bin
