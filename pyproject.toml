[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unpixel"
version = "0.1.0"
description = "Turn flat-color raster artwork into clean, layered SVG with a transparent background."
readme = "README.md"
requires-python = ">=3.15"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
dependencies = ["numpy>=2.5.4", "pillow>=13.0.0", "scipy>=1.18.1"]

[project.optional-dependencies]
dev = ["pytest>=9.2.0"]

[project.scripts]
unpixel = "unpixel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/unpixel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["golden: compares the battery's SVGs with tests/golden.json (slow; deselect with -m 'not golden')"]
