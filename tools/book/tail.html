</main>
</div>
<script>
(function(){
  var root=document.documentElement,btn=document.getElementById('theme');
  try{var t=localStorage.getItem('book-theme');if(t)root.dataset.theme=t;}catch(e){}
  btn.addEventListener('click',function(){
    var dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme=dark?'light':'dark';
    try{localStorage.setItem('book-theme',root.dataset.theme);}catch(e){}
  });
  var box=document.getElementById('viewer');if(!box)return;
  var DATA=JSON.parse(document.getElementById('viewer-data').textContent);
  var state={image:'principito',cut:50,zoom:1};
  var base=box.querySelector('.base'),top_=box.querySelector('.over img'),over=box.querySelector('.over'),rule=box.querySelector('.rule');
  var inner=box.querySelector('.inner'),range=box.querySelector('input[type=range]'),links=box.querySelector('.links');
  function press(group,v){box.querySelectorAll('[data-'+group+']').forEach(function(b){b.setAttribute('aria-pressed',b.dataset[group]===v?'true':'false');});}
  function draw(){
    var d=DATA[state.image];
    base.src=d.out;top_.src=d.src;
    base.alt='unpixel, '+state.image;top_.alt=state.image;
    inner.style.width=(100*state.zoom)+'%';
    over.style.clipPath='inset(0 '+(100-state.cut)+'% 0 0)';rule.style.left=state.cut+'%';
    links.innerHTML='SVG: <a href="'+d.svg+'">'+state.image+'.svg</a>';
    press('image',state.image);press('zoom',String(state.zoom));
  }
  box.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;var s=b.dataset;
    if(s.image)state.image=s.image;if(s.zoom)state.zoom=+s.zoom;
    draw();
  });
  range.addEventListener('input',function(){state.cut=+range.value;draw();});
  draw();
})();
</script>
</body>
</html>
